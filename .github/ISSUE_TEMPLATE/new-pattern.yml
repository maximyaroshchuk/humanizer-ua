name: Нова ознака ШІ або русизм
description: Ознака ШІ-тексту чи зворот, якого не ловить жоден патерн або словник.
labels: ["enhancement"]
body:
  - type: textarea
    id: before
    attributes:
      label: Приклад
      description: Справжній текст з ознакою. Прибери все приватне.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: Як написала б людина
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Джерело норми
      description: Для русизму чи кальки — словник або посібник (Антоненко-Давидович, Пономарів, Караванський, правопис), де це описано.
  - type: textarea
    id: why
    attributes:
      label: Чому наявний патерн цього не покриває
      description: Назви найближчий патерн і поясни, чому він не підходить. Більшість нових ознак вписуються в наявні.
    validations:
      required: true
