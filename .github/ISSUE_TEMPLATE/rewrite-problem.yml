name: Проблема з правкою
description: Правка залишила ознаку, змінила зміст, додала факт, зіпсувала норму чи docx.
labels: ["bug"]
body:
  - type: dropdown
    id: problem
    attributes:
      label: Що пішло не так
      options:
        - Ознака ШІ залишилася після правки
        - Правка додала або загубила факт
        - Правка змінила текст, який був у порядку
        - Правка порушила мовну норму
        - Лінтер помиляється (хибне спрацювання чи пропуск)
        - Файл .docx пошкоджено або втрачено форматування
        - Інше
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Вхідний текст
      description: Текст, який ти дав скілу. Прибери все приватне. Для docx — опиши будову файлу або додай мінімальний приклад.
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: Як викликав
      description: Агент, модель і точний запит.
      placeholder: "Claude Code, Opus 5.5: /humanizer-ua і вставлений текст"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Результат
      description: Що повернув скіл.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Як мало бути
      description: Процитуй хибне речення і напиши, як написав би уважний редактор. Вкажи номер патерна, якщо знаєш.
    validations:
      required: true
